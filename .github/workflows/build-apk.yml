name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Siapkan folder web
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Install dependensi
        run: npm install

      - name: Buat project Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Perbaiki keyboard menutupi input
        continue-on-error: true
        run: |
          M=android/app/src/main/AndroidManifest.xml
          S=android/app/src/main/res/values/styles.xml
          if ! grep -q windowSoftInputMode "$M"; then
            perl -0pi -e 's#<activity #<activity android:windowSoftInputMode="adjustResize" #' "$M" || true
          fi
          perl -0pi -e 's#(<style name="AppTheme.NoActionBar"[^>]*>)#$1\n        <item name="android:windowOptOutEdgeToEdgeEnforcement">true</item>#' "$S" || true
          grep -n "windowSoftInputMode" "$M" || true
          grep -n "OptOutEdgeToEdge" "$S" || true

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Inventory-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
